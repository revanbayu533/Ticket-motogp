<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252a3b"/>
      <stop offset="50%" stop-color="#191c28"/>
      <stop offset="100%" stop-color="#10121a"/>
    </linearGradient>
    <linearGradient id="qgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7e8ba8"/>
    </linearGradient>
  </defs>

  <!-- Clean Dark Background Frame -->
  <rect width="400" height="450" fill="#131520" rx="16"/>

  <!-- Subtle Dashed Radar Circle -->
  <circle cx="200" cy="170" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="6,6" stroke-width="1.5"/>

  <!-- Rider Silhouette (Helmet & Shoulder) -->
  <path d="M 135 150 C 135 75, 265 75, 265 150 C 265 195, 245 225, 200 225 C 155 225, 135 195, 135 150 Z" fill="url(#body)" stroke="#3a425c" stroke-width="2.5"/>
  <path d="M 85 360 C 85 270, 130 250, 200 250 C 270 250, 315 270, 315 360 Z" fill="url(#body)" stroke="#3a425c" stroke-width="2.5"/>

  <!-- Helmet Visor Strip -->
  <path d="M 155 140 C 170 130, 230 130, 245 140 C 235 152, 165 152, 155 140 Z" fill="#0c0e14" stroke="#4d5778" stroke-width="1.5"/>

  <!-- Glowing Question Mark Symbol -->
  <text x="200" y="270" font-family="'Arial Black', Impact, sans-serif" font-size="120" font-weight="900" fill="url(#qgrad)" fill-opacity="0.45" text-anchor="middle" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">?</text>

  <!-- Status Badges -->
  <rect x="135" y="325" width="130" height="26" rx="6" fill="#E10600" fill-opacity="0.2" stroke="#E10600" stroke-width="1.5"/>
  <text x="200" y="342" font-family="'Arial Black', Impact, sans-serif" font-size="12" font-weight="900" fill="#ff4d4d" text-anchor="middle" letter-spacing="3">TBA SEAT</text>

  <text x="200" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#8d99b5" text-anchor="middle" letter-spacing="1">MENUNGGU PENGUMUMAN</text>
</svg>
